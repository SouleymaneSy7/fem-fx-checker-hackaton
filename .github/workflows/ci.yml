name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Build
        run: bun run build

        env:
          # Fake values — the build never connects to a real service, it
          # just needs every variable defined so module-scope
          # initialization (Neon, Upstash Redis, Better Auth, Resend)
          # doesn't throw during evaluation.
          NEXT_PUBLIC_EXCHANGE_API_BASE: https://api.frankfurter.dev/v2
          DATABASE_URL: postgres://user:pass@localhost:5432/db?sslmode=require
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-chars
          UPSTASH_REDIS_REST_URL: https://example.upstash.io
          UPSTASH_REDIS_REST_TOKEN: placeholder
          RESEND_API_KEY: re_ci_placeholder
          RESEND_FROM_EMAIL: ci-placeholder@example.com
          GITHUB_CLIENT_ID: placeholder
          GITHUB_CLIENT_SECRET: placeholder
          GOOGLE_CLIENT_ID: placeholder.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: placeholder
